<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DataView — Simple Charting Tool</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#050911;
    --panel:#171A21;
    --line:#262B35;
    --text:#c5c6c7;
    --muted:#8A909C;
    --accent:#5EE6C8;
    --accent2:#7C8CFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  header{
    padding:32px 40px 20px;
    border-bottom:1px solid var(--line);
  }
  header h1{
    margin:0;
    font-size:22px;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  header p{
    margin:6px 0 0;
    color:var(--muted);
    font-size:14px;
  }
  main{
    display:grid;
    grid-template-columns:280px 1fr;
    gap:24px;
    padding:28px 40px;
    max-width:1200px;
    margin:0 auto;
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:20px;
  }
  .panel h2{
    font-size:13px;
    color:var(--muted);
    margin:0 0 14px;
    font-weight:500;
  }
  label{
    display:block;
    font-size:13px;
    color:var(--muted);
    margin-bottom:6px;
    margin-top:16px;
  }
  select, textarea, input[type=text]{
    width:100%;
    background:#0F1115;
    border:1px solid var(--line);
    color:var(--text);
    padding:8px 10px;
    border-radius:6px;
    font-size:13px;
    font-family:inherit;
  }
  textarea{
    resize:vertical;
    min-height:90px;
    line-height:1.5;
  }
  button{
    margin-top:20px;
    width:100%;
    background:var(--accent);
    color:#0F1115;
    border:none;
    padding:10px;
    border-radius:6px;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  button:hover{opacity:0.9;}
  .chart-wrap{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:24px;
    min-height:420px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  canvas{max-height:400px;}
</style>
</head>
<body>

<header>
  <h1>DataView</h1>
  <p>Paste your data, pick a chart type, render instantly — powered by Chart.js.</p>
</header>

<main>
  <div class="panel">
    <h2>CONFIGURE</h2>

    <label for="chartType">Chart type</label>
    <select id="chartType">
      <option value="bar">Bar</option>
      <option value="line">Line</option>
      <option value="pie">Pie</option>
      <option value="doughnut">Doughnut</option>
      <option value="radar">Radar</option>
    </select>

    <label for="labels">Labels (comma separated)</label>
    <textarea id="labels">Jan, Feb, Mar, Apr, May</textarea>

    <label for="values">Values (comma separated)</label>
    <textarea id="values">12, 19, 8, 15, 22</textarea>

    <label for="datasetLabel">Dataset name</label>
    <input type="text" id="datasetLabel" value="Sample Data">

    <button onclick="renderChart()">Render chart</button>
  </div>

  <div class="chart-wrap">
    <canvas id="myChart"></canvas>
  </div>
</main>

<script>
let chartInstance = null;

function renderChart(){
  const type = document.getElementById('chartType').value;
  const labels = document.getElementById('labels').value.split(',').map(s => s.trim());
  const values = document.getElementById('values').value.split(',').map(s => parseFloat(s.trim()));
  const datasetLabel = document.getElementById('datasetLabel').value;

  const ctx = document.getElementById('myChart').getContext('2d');

  if (chartInstance) chartInstance.destroy();

  const palette = ['#5EE6C8','#7C8CFF','#F7B267','#F45B69','#9D8DF1','#5AC8FA'];

  chartInstance = new Chart(ctx, {
    type: type,
    data: {
      labels: labels,
      datasets: [{
        label: datasetLabel,
        data: values,
        backgroundColor: type === 'line' ? 'rgba(94,230,200,0.15)' : palette,
        borderColor: '#5EE6C8',
        borderWidth: type === 'line' ? 2 : 1,
        fill: type === 'line',
        tension: 0.35
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: {
          labels: { color: '#E7E9EC' }
        }
      },
      scales: (type === 'pie' || type === 'doughnut' || type === 'radar') ? {} : {
        x: { ticks: { color: '#8A909C' }, grid: { color: '#262B35' } },
        y: { ticks: { color: '#8A909C' }, grid: { color: '#262B35' } }
      }
    }
  });
}

renderChart();
</script>

</body>
</html>
