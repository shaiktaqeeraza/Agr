<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradeLink</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.2"></script><script src="app.js"></script></head><body><nav id="nav"></nav><main>
<h1>Messages</h1><p class="sub">Your conversations with other traders.</p>
<form id="f" style="max-width:none;margin-bottom:24px">
 <div id="toBox"></div>
 <textarea id="text" placeholder="Write your message" required maxlength="1000"></textarea>
 <div class="err" id="err"></div>
 <div><button>Send message</button></div>
</form>
<div id="inbox">Loading…</div>
<script>
let me; const params=new URLSearchParams(location.search);
let toId=params.get('to'), toName=params.get('name');
(async()=>{
  me=await requireUser(); if(!me) return; renderNav();
  document.getElementById('toBox').innerHTML=toId?`<p>To: <strong>${esc(toName)}</strong></p>`:'<p class="meta">To reply, use the Reply button on a message. To start a chat, press "Contact trader" on a listing.</p>';
  if(!toId) document.getElementById('f').style.display='none';
  load(); setInterval(load,8000);
})();
async function load(){
  const r=await db.listDocuments(DB_ID,'messages',[Query.orderDesc('$createdAt'),Query.limit(100)]);
  document.getElementById('inbox').innerHTML=r.documents.length?r.documents.map(m=>{
    const mine=m.fromId===me.$id, other=mine?m.toName:m.fromName, otherId=mine?m.toId:m.fromId;
    return `<div class="msg ${mine?'me':''}"><div class="meta">${mine?'You to':'From'} ${esc(other)} · ${new Date(m.$createdAt).toLocaleString()}</div>
    ${esc(m.text)}${mine?'':` <a href="messages.html?to=${otherId}&name=${encodeURIComponent(other)}">Reply</a>`}</div>`;}).join(''):'<p>No messages yet.</p>';
}
document.getElementById('f').onsubmit=async e=>{
  e.preventDefault();
  const t=document.getElementById('text');
  try{
    await db.createDocument(DB_ID,'messages',ID.unique(),
      {fromId:me.$id,fromName:me.name,toId,toName,text:t.value.trim()},
      [Permission.read(Role.user(me.$id)),Permission.read(Role.user(toId))]);
    t.value=''; load();
  }catch(x){document.getElementById('err').textContent=x.message;}
};
</script>
</main></body></html>
