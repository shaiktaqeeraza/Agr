<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradeLink</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.2"></script><script src="app.js"></script></head><body><nav id="nav"></nav><main>
<h1>Your profile <span id="vb"></span></h1><p class="sub">Other traders see this before they contact you.</p>
<form id="f">
 <label>Name<input id="name"></label>
 <label>Business name<input id="business"></label>
 <label>City<input id="city"></label>
 <label>What do you trade?<input id="trade"></label>
 <div class="err" id="err"></div>
 <button>Save changes</button>
</form>
<h2 style="margin-top:36px">Your listings</h2>
<div id="mine">Loading…</div>
<script>
let me;
(async()=>{
  me=await requireUser(); if(!me) return; renderNav();
  const p=await db.getDocument(DB_ID,'profiles',me.$id);
  ['name','business','city','trade'].forEach(k=>document.getElementById(k).value=p[k]||'');
  if((await getVerifiedIds()).has(me.$id)) document.getElementById('vb').innerHTML='<span class="badge">Verified</span>';
  loadMine();
})();
document.getElementById('f').onsubmit=async e=>{
  e.preventDefault();
  const v=id=>document.getElementById(id).value.trim(), err=document.getElementById('err');
  try{ await db.updateDocument(DB_ID,'profiles',me.$id,{name:v('name'),business:v('business'),city:v('city'),trade:v('trade')}); err.style.color='#0f6b5c'; err.textContent='Saved.'; }
  catch(x){ err.style.color='#a33'; err.textContent=x.message; }
};
async function loadMine(){
  const r=await db.listDocuments(DB_ID,'listings',[Query.equal('ownerId',me.$id),Query.orderDesc('$createdAt')]);
  document.getElementById('mine').innerHTML=r.documents.length?r.documents.map(l=>`
   <div class="card ${l.type}"><h3>${esc(l.title)}</h3><div class="meta">${esc(l.category)} · ${esc(l.city)} · ₹${esc(l.price)}</div>
   <button class="danger" onclick="del('${l.$id}')">Delete listing</button></div>`).join(''):'<p>You have no listings yet. <a href="post.html">Post one</a>.</p>';
}
async function del(id){ if(confirm('Delete this listing?')){ await db.deleteDocument(DB_ID,'listings',id); loadMine(); } }
</script>
</main></body></html>
